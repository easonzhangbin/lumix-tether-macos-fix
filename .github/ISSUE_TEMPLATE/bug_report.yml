name: Bug report / 故障报告
description: Report a connection problem or an untested camera configuration. / 报告连接故障或未验证机型。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimal, redacted report. Do not post camera serial numbers, image payloads, full USB captures, or unredacted full crash reports.
        请只提交必要的脱敏信息，不要上传相机序列号、图像内容、完整 USB 抓包或未脱敏的完整崩溃报告。
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting / 提交前确认
      options:
        - label: I checked the actual Tether version and am using official 2.12, not an old 2.11 shortcut. / 已确认实际使用官方 2.12，而非旧 2.11 快捷方式。
          required: true
        - label: I removed serial numbers, private paths, images and other private identifiers from the report. / 已删除序列号、私人路径、图像及其他私人标识。
          required: true
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware / 相机型号与固件
      placeholder: "DC-S1H, firmware version … / 固件版本 …"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model or chip / Mac 型号或芯片
      placeholder: "MacBookPro18,2 / Apple M1 Max"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build / macOS 版本与构建号
      placeholder: "27.0.1 (26A434)"
    validations:
      required: true
  - type: input
    id: tether
    attributes:
      label: Tether version and build / Tether 版本与构建号
      placeholder: "2.12 / 2.12.0.5"
    validations:
      required: true
  - type: input
    id: fix_version
    attributes:
      label: Fix release or commit / 修复工具版本或提交
    validations:
      required: true
  - type: dropdown
    id: recovery_mode
    attributes:
      label: Entry point or mode used / 使用的入口或模式
      options:
        - "Normal recovery script (default) / 普通恢复脚本（默认）"
        - "Read-only --diagnose / 只读 --diagnose"
        - "Restart Camera Service and Restore / 重启相机服务并恢复连接"
        - "Explicit --restart-camera-service / 明确指定 --restart-camera-service"
        - "Other or uncertain / 其他或不确定"
    validations:
      required: true
  - type: textarea
    id: usb
    attributes:
      label: USB connection / USB 连接情况
      description: Cable, direct connection or hub, negotiated speed if known, and camera USB mode. / 数据线、直连或集线器、已知协商速率及相机 USB 模式。
    validations:
      required: true
  - type: dropdown
    id: recurrence
    attributes:
      label: When did it fail? / 何时失败？
      options:
        - "First connection; it has never worked / 首次连接，尚未成功过"
        - "After USB unplug/reconnect following a successful session / 成功连接后，USB 拔插重连时复发"
        - "At a later Tether launch without reconnecting / 未重新插线，之后启动 Tether 时失败"
        - "Other or uncertain / 其他或不确定"
    validations:
      required: true
  - type: textarea
    id: camera_clients
    attributes:
      label: Camera clients and service ownership / 相机客户端与服务占用
      description: List camera/import apps and whether they were fully quit, not hidden. Add short redacted owner or restart-guard refusal lines if available. Mention Preview only as an observation, not an assumed cause. / 说明相机或导入软件是否已正常退出，而非只隐藏窗口。可提供脱敏后的简短占用者或重启守卫拒绝信息，不能仅凭“预览”曾运行就假定根因。
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Furthest verified stage / 已验证到的步骤
      options:
        - "No camera detected / 未检测到相机"
        - "Service-restart guard refused; no USB probe ran / 服务重启守卫拒绝，未运行 USB 探针"
        - "Interface busy; drain could not start / 接口被占用，尚未开始排空"
        - "Interface opened; drain or new PTP command failed / 接口已打开，排空或新的 PTP 命令失败"
        - "Camera detected; recovery failed / 检测到相机但恢复失败"
        - "Fresh handshake passed; Tether did not connect / 新握手通过但 Tether 未连接"
        - "Tether connected; no live view / Tether 已连接但没有实时预览"
        - "Live view appeared; a later issue occurred / 已出现实时预览，之后出现故障"
        - "Other / 其他"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result / 复现步骤、预期与实际结果
      description: Include the order of app exit, USB reconnection, recovery-script launch and Tether launch; state whether you launched Tether through the script. / 请按顺序说明退出应用、USB 重连、运行恢复脚本和启动 Tether 的步骤，并说明是否从脚本启动 Tether。
    validations:
      required: true
  - type: textarea
    id: log_excerpt
    attributes:
      label: Relevant redacted status/error lines / 相关脱敏状态或错误行
      description: Include only relevant headers, lengths, status codes and redacted ownership/guard results. Do not paste a full crash report, capture or log with private paths. / 仅提供相关协议头、长度、状态码及脱敏后的占用或守卫结果，不要粘贴完整崩溃报告、抓包或含私人路径的完整日志。
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional observations / 其他观察
      description: Note whether recovery had worked before and any different-OS result. A previous success does not establish a permanent fix; a USB ID alone does not establish model support. / 可说明此前是否成功恢复及其他系统上的结果。一次成功不等于永久修复，不能仅凭 USB ID 推断机型兼容性。
