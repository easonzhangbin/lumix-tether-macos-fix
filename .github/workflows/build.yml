name: Build and validate release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate build inputs without hardware access
        run: ./scripts/build.sh --dry-run
      - name: Compile arm64 USB and guarded service helpers
        run: ./scripts/build.sh
      - name: Verify signatures, architecture and script syntax
        run: ./scripts/self-check.sh
      - name: Run isolated recovery mocks and pure guard tests
        run: ./scripts/test-recovery.sh
      - name: Compile Guardian beta and run isolated event and policy checks
        run: ./experiments/connection-guardian/build.sh
      - name: Package Guardian beta and verify an independent extraction
        run: ./experiments/connection-guardian/package.sh
      - name: Package and verify an independent extraction
        run: ./scripts/package.sh
